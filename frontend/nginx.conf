server {
    listen 80;

    # 1. Le Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Le Backend (Proxying)
    location /api/ {
        # IMPORTANT : Ajoute le slash à la fin si tu veux supprimer le préfixe /api
        # Sinon, ton backend recevra /api/ton-endpoint
        proxy_pass http://backend:8000/; 
        
        # Headers nécessaires pour que FastAPI comprenne l'origine
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}