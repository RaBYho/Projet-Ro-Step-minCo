name: CI/CD Pipeline - Projet RO (FastAPI + Vue.js)

# Déclenchement du pipeline lors d'un push ou d'une PR sur la branche principale
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Définition des variables globales
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ====================================================
  # 1. ÉTAPE DE TEST & VALIDATION DU BACKEND (CI)
  # ====================================================
  test-backend:
    name: Continuous Integration - Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances et validation du code
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Vérification de la syntaxe de tous les fichiers Python (graphe, stepping, main, etc.)
          python -m py_compile main.py graphe.py stepping.py initialisation.py initialisation_minli.py
          # Exécution des tests unitaires Pytest s'il existe un dossier 'tests'
          if [ -d "tests" ]; then pytest; fi

  # ====================================================
  # 2. ÉTAPE DE BUILD & PUBLICATION DES IMAGES DOCKER (CD)
  # ====================================================
  build-and-push:
    name: Continuous Delivery - Build & Push Docker
    needs: test-backend # Attend le succès des tests backend avant de se lancer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push de l'image Backend (FastAPI)
      - name: Build and Push - Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      # Build & Push de l'image Frontend (Vue.js + Tailwind + Nginx)
      - name: Build and Push - Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
